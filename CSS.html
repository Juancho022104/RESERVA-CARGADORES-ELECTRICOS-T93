<style>
  :root {
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html { font-size: 17px; }

  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(16, 185, 129, 0.08), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(59, 130, 246, 0.07), transparent 45%),
      #ffffff;
    color: #0f172a;
    min-height: 100vh;
  }

  .glass {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(15, 23, 42, 0.08);
    box-shadow: 0 4px 20px -8px rgba(15, 23, 42, 0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .glass-strong {
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(15, 23, 42, 0.09);
    box-shadow: 0 8px 28px -10px rgba(15, 23, 42, 0.14);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
  }

  .slot-card {
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
  }
  .slot-card:not(.is-disabled):hover {
    transform: translateY(-3px);
  }

  .slot-card.is-available {
    cursor: pointer;
  }
  .slot-card.is-available:hover {
    border-color: rgba(16, 185, 129, 0.55);
    box-shadow: 0 10px 30px -12px rgba(16, 185, 129, 0.28);
  }

  .slot-card.is-selected {
    border-color: rgba(16, 185, 129, 0.8) !important;
    background: rgba(16, 185, 129, 0.08) !important;
    box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.55), 0 12px 30px -10px rgba(16, 185, 129, 0.3);
  }

  .slot-card.is-occupied {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .slot-card.is-locked {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .peak-badge {
    background: linear-gradient(135deg, rgba(249, 115, 22, 0.14), rgba(239, 68, 68, 0.1));
    border: 1px solid rgba(249, 115, 22, 0.35);
    color: #c2410c;
  }

  .dot {
    width: 9px; height: 9px; border-radius: 999px; display: inline-block;
  }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-backdrop {
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.12); border-radius: 999px; }

  .spinner {
    border: 3px solid rgba(15,23,42,0.12);
    border-top-color: #10b981;
    border-radius: 50%;
    width: 22px; height: 22px;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-primary {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 8px 24px -8px rgba(16, 185, 129, 0.45);
  }
  .btn-primary:disabled {
    opacity: 0.4;
    box-shadow: none;
    cursor: not-allowed;
  }
  .btn-primary:not(:disabled):hover {
    filter: brightness(1.06);
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0.7;
  }
</style>
